# Part of the APK.audio project — http://APK.audio — made by Anthony Kuzub
# How this site ships. Read by .apk.scripts/deploy_all.py in the APK.audio checkout:
# `steps` run here in order (any failure stops this site), then `local_dir` is
# mirrored to `server_dir` over FTPS — or `command` uploads instead. `env` maps
# names this site expects to slots in ~/.apk.secrets.env (never committed).
# This replaced the GitHub Actions workflow on 2026-10-31.
# The CAD is the sibling submodule, built here (CI checked it out beside this
# repo). The site is laid out in $DEPLOY_OUT, a scratch folder deploy_all.py
# makes, because _site/ is not ignored in this repo. GitHub Pages and the nightly
# schedule are gone with the workflow.
[deploy]
site = acoustics.like.audio
steps =
    cd ../EDITORS.CAD.Like.audio && (npm ci || npm install) && npm run build
    CAD_CONTRACT_DIR="$(cd ../EDITORS.CAD.Like.audio && pwd)/contract" npm test
    rm -rf "$DEPLOY_OUT/_site" && mkdir -p "$DEPLOY_OUT/_site/vendor" "$DEPLOY_OUT/_site/catalogue"
    cp -r index.html css js LICENSE Documentation "$DEPLOY_OUT/_site/"
    cp -r vendor/apk-contracts "$DEPLOY_OUT/_site/vendor/"
    cp -r ../EDITORS.CAD.Like.audio/dist "$DEPLOY_OUT/_site/cad"
    cp vendor/bim/parts.json "$DEPLOY_OUT/_site/catalogue/parts.json"
    cp js/site.published.js "$DEPLOY_OUT/_site/js/site.js"
    node scripts/smoke-frame.mjs "$DEPLOY_OUT/_site"
local_dir = $DEPLOY_OUT/_site
server_dir = ./
env =
    FTP_SERVER = ACOUSTIC_FTP_SERVER
    FTP_USERNAME = ACOUSTIC_FTP_USERNAME
    FTP_PASSWORD = ACOUSTIC_FTP_PASSWORD
    FTP_SERVER_DIR = ACOUSTIC_FTP_SERVER_DIR

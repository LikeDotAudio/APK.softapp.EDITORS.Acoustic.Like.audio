<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACOUSTIC.LIKE.AUDIO — Room Acoustics on the CAD</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="bar">
    <div class="brand">🔊 ACOUSTIC<span>.LIKE.AUDIO</span></div>
    <div class="group" id="opens">
      <button id="wizardBtn" title="The wizard: a room, what is in it, the system, the walls and what covers them, then what you want to know">🧭 Wizard</button>
      <button id="openBtn" title="Open a project, or a floor plan to start a new room layout from">📂 Open ▾</button>
      <div class="group" id="open">
        <label class="button" title="Open a saved project: the CAD drawing, speakers, mics and settings (a .acoustic-session.json file)">📂 Open project<input type="file" id="openSession" accept=".json,application/json"></label>
        <label class="button" title="Open a floor plan as a new room layout: a DXF becomes the drawing, an image goes under it to trace the walls over">📐 Open floor plan<input type="file" id="openFloorPlan" accept=".dxf,image/*"></label>
      </div>
      <button id="grabBag" title="A room from the library, picked at random, drawn into the CAD">🎲 Room</button>
      <select id="roomPick" title="Pick a room shape from the library, drawn into the CAD"></select>
    </div>
    <!-- the speaker sets get a line of their own, under the name -->
    <i class="rowEnd"></i>
    <!-- the room, then its speakers (the arrangement, then its spacing — main.js puts the fields after it), then what else stands in it -->
    <div id="arrangement" title="Speaker sets A, B and C: a row each — pick one to make it sound and show its reference angles over the room; Place puts it around the mix seat, Empty silences it"></div>
    <!-- the monitor controller: sets, volume, mute and solo per channel, the noise generator (ui/monitor.js) — main.js moves it to the end of set C's row -->
    <button id="monitorBtn" title="Monitor controller: the speaker set, volume, dim and mute, mute / solo / polarity / trim per speaker, white, pink or brown noise and calibration">🎛 Monitor ▾</button>
    <div id="monitor" class="monitor"></div>
    <i class="rowEnd"></i>
    <div class="group" id="modes">
      <button data-mode="cad" title="Edit the drawing in the CAD (Esc)">✋ CAD</button>
      <button data-mode="pick-wall" title="Work the room's walls: click one to say what it is · drag anywhere to draw a wall · drag a corner (walls joined to it follow; drop it on another corner to join) · Alt-drag a corner to pull one wall away · drag a wall's middle to move it · right-click a wall to delete it">▭ Walls</button>
    </div>
    <!-- what stands in the room, placed together in the middle: the sources, the receivers, the furniture (folded, ui/fold.js) -->
    <div class="group" id="place">
      <button data-mode="place-speaker" title="Click the plan to place a speaker (Shift keeps placing)">🔊 ＋ Speaker</button>
      <button data-mode="place-mic" title="Click the plan to place a microphone">🎤 ＋ Mic</button>
      <button id="furnitureBtn" title="Draw furniture into the CAD plan: a desk, the console, a couch, a rack …">＋ Furniture ▾</button>
      <div class="group" id="furniture">
        <button data-arm="desk-1800x900" title="Draw a desk in the CAD plan — click where it goes">＋ Desk</button>
        <button data-arm="producer-desk-1800x600" title="Draw a producer desk in the CAD plan — behind the mix seat">＋ Producer desk</button>
        <button data-arm="console-2400x1000" title="Draw a mixing console in the CAD plan">＋ Console</button>
        <button data-arm="couch-2000x900" title="Draw a couch in the CAD plan">＋ Couch</button>
        <button data-arm="rack-600x800" title="Draw a 24 U equipment rack, 600×800, in the CAD plan — select it to fill it: its U used and free, and how deep each piece really goes">＋ Rack</button>
        <button data-arm="rack-600x1000" title="Draw a deep 600×1000 equipment rack in the CAD plan — for gear that runs long behind the rails">＋ Deep rack</button>
        <button data-arm="rack-800x1000" title="Draw a wide 800×1000 equipment rack in the CAD plan — cable room down both sides">＋ Wide rack</button>
        <button data-arm="drum-kit-1800x1500" title="Draw a drum kit in the CAD plan — kit, cymbals and throne">＋ Drum kit</button>
        <button data-arm="table-heavy-2400x1000" title="Draw a heavy hardwood table in the CAD plan — a panel absorber in the bottom octaves">＋ Table</button>
        <button data-arm="guitar-amp-600x280" title="Draw a guitar combo amp in the CAD plan">＋ Guitar amp</button>
        <button data-arm="guitar-stack-760x360" title="Draw a guitar half stack — a 4×12 and its head — in the CAD plan">＋ Half stack</button>
        <button data-arm="amp-head-700x280" title="Draw an amplifier head on its own in the CAD plan">＋ Amp head</button>
        <button data-arm="keyboard-88-1350x380" title="Draw a stage piano, 88 keys on an X-stand, in the CAD plan">＋ Keyboard</button>
        <button data-arm="keyboard-61-1000x350" title="Draw a 61-key synth on a stand in the CAD plan">＋ Synth</button>
        <button data-arm="hammond-b3-1250x730" title="Draw a Hammond B-3 organ with its pedals in the CAD plan">＋ Hammond</button>
        <button data-arm="leslie-122-840x550" title="Draw a Leslie 122 rotating speaker in the CAD plan — beside the Hammond">＋ Leslie</button>
        <button data-arm="grand-piano-1480x2110" title="Draw a 211 cm grand piano in the CAD plan — the keyboard toward you">＋ Grand piano</button>
        <button data-arm="console-broadcast-2000x1100" title="Draw a broadcast console on a leg stand in the CAD plan — 20 strips, a meter bridge">＋ Broadcast console</button>
        <button data-arm="massonberg-2400x600" title="Draw a Massonberg stick diffuser in the CAD plan — 2.4 m of 1×1 in sticks glued at random lengths, steel on its sled to balance them">＋ Massonberg</button>
        <button data-arm="rug-2400x1700" title="Lay a 2400×1700 rug on the floor in the CAD plan — it takes the top end off a hard floor">＋ Rug</button>
        <button data-arm="rug-3000x2000" title="Lay a 3000×2000 rug on the floor in the CAD plan">＋ Rug 3×2</button>
        <button data-arm="rug-4000x3000" title="Lay a 4000×3000 rug on the floor in the CAD plan — under a band">＋ Rug 4×3</button>
      </div>
    </div>
    <div class="group" id="viewmode">
      <button data-view="six" title="Plan, ceiling and four elevations">▦ 6 views</button>
      <button data-view="3d" title="The room in 3-D, with the plan beside it">◫ 3-D</button>
      <button data-view="wall" title="One wall planned: its elevation split by the division lines drawn in the CAD, each region and what it is, the finish schedule, a stud section of every build, and what the wall soaks up and lets through">🧱 Wall</button>
      <button data-show="trace" title="Ray tracing over every view, on or off: each reflection path from the speakers to the mix seat, up to 3rd order, coloured by its level at the current frequency — sweep to watch them change">✳ Ray tracing</button>
    </div>
    <button id="moreBtn" title="The tour, a song, and how fast a room builds up in 3-D">⋯</button>
    <div id="more">
      <div class="group">
      <button id="tour" title="A film in a window of its own — every view revealed and swept up and down, the groups together, the 3-D built up and swept, ray tracing, then a summary — full or a 5 s / 10 s summary, saved as a video">🎞 Tour</button>
      <label class="button" title="Play a song: the field follows the frequency it excites (WAV, MP3, FLAC…)">🎵 Song<input type="file" id="songFile" accept="audio/*"></label>
      </div>
      <label class="reveal" title="How fast a room builds up in 3-D when it arrives — wireframe, grid, surfaces, speakers, treatments. 0: all at once. Moving it plays the reveal again">Reveal <input type="range" id="revealSpeed" min="0" max="4" step="0.25"><output id="revealOut"></output></label>
    </div>
    <div id="acx"></div>
    <div class="status" id="status"></div>
    <div id="player" class="player" hidden></div>
  </header>

  <main>
    <section id="views" class="six">
      <div class="tile plan" data-face="plan">
        <header>Plan · CAD.Like.audio <span class="sub" id="sheetName">draw the room here</span> <button id="toPlan" hidden title="Jump the CAD back to the plan">⌂ Plan</button> <button id="popCad" title="Give the CAD a window of its own — the plan stays here">⇱ Pop out</button></header>
        <div class="stage">
          <iframe id="cad" src="../EDITORS.CAD.Like.audio/dist/index.html#/drawing?host=acoustic" title="CAD.Like.audio"></iframe>
          <canvas class="overlay"></canvas>
          <div class="hits"></div>
          <div class="capture"></div>
        </div>
      </div>
      <div class="tile face" data-face="ceiling"><canvas></canvas><div class="readout"></div></div>
      <div class="tile face" data-face="front"><canvas></canvas><div class="readout"></div></div>
      <div class="tile face" data-face="back"><canvas></canvas><div class="readout"></div></div>
      <div class="tile face" data-face="left"><canvas></canvas><div class="readout"></div></div>
      <div class="tile face" data-face="right"><canvas></canvas><div class="readout"></div></div>
      <!-- the 3-D room's own bar: how the field is worked out, and what the room shows — all laid out when it has a window of its own -->
      <div class="tile t3d" data-face="3d">
        <header class="viewbar">3-D room
          <span class="group" id="method">
            <button data-method="wave" title="Image sources with phase — interference, SBIR, boundary gain">Wave</button>
            <button data-method="energy" title="Direct + diffuse energy per octave band — coverage">Energy</button>
            <button data-method="modal" title="Room modes — the low end, below Schroeder">Modal</button>
          </span>
          <button class="viewMore" title="What the room shows">⋯</button>
          <span class="group shows">
            <button data-show="field" title="The field painted on the floor and the walls">Field</button>
            <button data-show="devices" title="The speakers, the people and their names">Devices</button>
            <button data-show="rays" title="Each speaker's first reflections to the mix seat">Reflections</button>
            <button data-show="talk" title="Every two people: how well each understands the other (STI)">Talk paths</button>
            <button data-show="trace" title="Every reflection path to the mix seat, up to 3rd order — over every view">Ray tracing</button>
          </span>
        </header>
        <canvas></canvas>
      </div>
      <div class="tile wall" data-face="wall"></div>
    </section>
    <aside id="inspector"></aside>
  </main>

  <div id="updated" role="status" hidden><span>⟳ This app was updated on the server — refresh to get the new version. Your room is kept.</span> <button data-act="refresh">⟳ Refresh</button> <button data-act="close" title="Not now">✕</button></div>
  <div id="notice" role="alert" hidden><span></span> <button data-act="undo">↶ Undo</button> <button data-act="close" title="Keep it where it is">✕</button></div>
  <!-- the field's colour scale and the frequency it is at, one strip: the slider's thumb is the current frequency -->
  <div id="scaleStrip">
    <div id="fieldScale" hidden title="The one colour scale every drawing of the field is painted in"><span class="lo"></span><i class="ramp"></i><span class="hi"></span></div>
    <div id="freqRow">
      <button id="sweep" title="Sweep the field from 20 Hz to 17 kHz">▶ Sweep</button>
      <span class="freq"><canvas id="freqCache" title="The frames painted so far: the sweep and the tour play these without waiting"></canvas><input type="range" id="freq" min="1.30103" max="4.23045" step="0.005" title="Frequency, on a log scale: 20 Hz to 17 kHz"><span class="ticks" id="freqTicks"></span></span>
      <output id="freqOut"></output>
    </div>
    <!-- the meters float over the bottom of the views, just above this strip, rather than taking a row of their own -->
    <footer class="foot">
      <div id="meters"></div>
      <div class="group" id="saves">
        <button id="graphsBtn" title="Show or hide the graphs over the views">📈</button>
        <span id="meterTray" title="Meters tucked away — click one to open it over the views"></span>
        <button id="undo" title="Undo the last change to the speakers, mics, furniture or room (Ctrl+Z) — the drawing has its own undo in the CAD" disabled>↶ Undo</button>
        <button id="redo" title="Redo (Ctrl+Shift+Z or Ctrl+Y)" disabled>↷ Redo</button>
        <button id="saveSession" title="Save the CAD drawing, speakers, mics and settings as one file (Ctrl+S)">💾 Save</button>
      </div>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
